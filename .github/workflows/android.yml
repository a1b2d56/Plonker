name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > plonker-release.jks
        {
          echo "storeFile=plonker-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload Phone APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: plonker-arm64-v8a-release
        path: app/build/outputs/apk/prod/release/*arm64-v8a*.apk

    - name: Upload Phone APKs (All Architectures Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: plonker-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: plonker-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk

    - name: Upload Android TV APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: plonker-tv-prod-release-signed
        path: tv/build/outputs/apk/prod/release/*.apk
